<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh yêu em ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     BẢNG MÀU & BIẾN DÙNG CHUNG
     ============================================================ */
  :root{
    --pink-deep:   #ff5f8f;
    --pink-soft:   #ffb6c9;
    --purple-deep: #7c3aed;
    --red-warm:    #ff4d6d;
    --cream:       #fff5f8;
    --glow:        rgba(255, 182, 201, 0.55);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    width:100%; min-height:100%;
    overflow-x:hidden;
    font-family:'Georgia','Times New Roman', serif;
    background:#1a0b1f;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    /* ---- BACKGROUND: gradient hồng -> tím -> đỏ nhẹ ---- */
    background: radial-gradient(circle at 20% 20%, rgba(255,150,180,0.35), transparent 45%),
                radial-gradient(circle at 80% 15%, rgba(180,120,255,0.30), transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(255,90,120,0.30), transparent 55%),
                linear-gradient(135deg, #2a0e3a 0%, #4a123f 35%, #7a1f4b 65%, #431237 100%);
    background-size: 200% 200%;
    animation: bgShift 18s ease-in-out infinite;
  }

  @keyframes bgShift{
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---- Lớp bokeh / ánh sáng mờ ---- */
  .bokeh-layer{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .bokeh{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%);
    filter:blur(2px);
    opacity:0.35;
    animation: floatBokeh linear infinite;
  }
  @keyframes floatBokeh{
    0%   { transform:translateY(0) translateX(0); }
    50%  { transform:translateY(-40px) translateX(20px); }
    100% { transform:translateY(0) translateX(0); }
  }

  /* ---- Hạt sáng lấp lánh ---- */
  .sparkle{
    position:absolute;
    width:3px; height:3px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    animation: sparkleAnim 3s ease-in-out infinite;
    box-shadow: 0 0 6px 2px rgba(255,255,255,0.8);
  }
  @keyframes sparkleAnim{
    0%, 100% { opacity:0; transform:scale(0.5); }
    50%      { opacity:1; transform:scale(1.2); }
  }

  /* ============================================================
     TRÁI TIM BAY (background hearts + click burst)
     ============================================================ */
  .hearts-layer{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .floating-heart{
    position:absolute;
    bottom:-10%;
    font-size:20px;
    color:var(--pink-soft);
    opacity:0.85;
    animation-name: riseUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    user-select:none;
  }
  @keyframes riseUp{
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity:0.9; }
    85%  { opacity:0.6; }
    100% { transform: translateY(-115vh) translateX(var(--drift, 30px)) rotate(20deg); opacity:0; }
  }

  .click-heart{
    position:fixed;
    pointer-events:none;
    z-index:50;
    font-size:18px;
    color:var(--red-warm);
    animation: clickPop 900ms ease-out forwards;
  }
  @keyframes clickPop{
    0%   { transform: translate(-50%,-50%) scale(0.6); opacity:1; }
    100% { transform: translate(-50%,-50%) translateY(-70px) scale(1.1); opacity:0; }
  }

  /* ============================================================
     KHUNG NỘI DUNG TRUNG TÂM
     ============================================================ */
  .stage{
    position:relative;
    z-index:5;
    width:100%;
    max-width:1400px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .center-content{
    position:relative;
    z-index:10;
    text-align:center;
    max-width:640px;
    padding:20px;
  }

  .main-title{
    font-family:'Brush Script MT', 'Segoe Script', 'Georgia', cursive, serif;
    font-size:clamp(2.4rem, 7vw, 4.6rem);
    font-weight:700;
    margin:0 0 14px 0;
    line-height:1.15;
    background: linear-gradient(90deg, #ffe3ec 0%, #ff9ebd 30%, #ff5f8f 55%, #ffffff 75%, #ff8fae 100%);
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation:
      fadeInTitle 1.6s ease forwards 0.3s,
      heartbeat 2.6s ease-in-out infinite 2s,
      shineText 6s linear infinite;
    text-shadow: 0 0 30px var(--glow);
  }

  @keyframes fadeInTitle{
    from{ opacity:0; transform:translateY(18px) scale(0.96); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes heartbeat{
    0%, 100% { transform:scale(1); }
    10%      { transform:scale(1.05); }
    20%      { transform:scale(1); }
    30%      { transform:scale(1.07); }
    40%      { transform:scale(1); }
  }
  @keyframes shineText{
    0%   { background-position: 0% center; }
    100% { background-position: 250% center; }
  }

  .subtitle{
    font-size:clamp(1rem, 2.4vw, 1.25rem);
    color:#ffe6ee;
    opacity:0;
    letter-spacing:0.3px;
    animation: fadeInSub 1.4s ease forwards 1.1s;
    margin-bottom:30px;
  }
  @keyframes fadeInSub{
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:translateY(0); }
  }

  .love-btn{
    font-family:inherit;
    font-size:1.05rem;
    padding:14px 34px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(120deg, var(--red-warm), var(--pink-deep), var(--purple-deep));
    background-size:200% auto;
    box-shadow: 0 8px 24px rgba(255, 79, 109, 0.45);
    opacity:0;
    animation: fadeInSub 1.4s ease forwards 1.6s, pulseBtn 2.5s ease-in-out infinite 3s;
    transition: transform 0.25s ease, background-position 0.5s ease, box-shadow 0.25s ease;
  }
  .love-btn:hover{
    transform:translateY(-3px) scale(1.04);
    background-position:right center;
    box-shadow: 0 12px 30px rgba(255, 79, 109, 0.6);
  }
  @keyframes pulseBtn{
    0%, 100% { box-shadow: 0 8px 24px rgba(255, 79, 109, 0.45); }
    50%      { box-shadow: 0 8px 34px rgba(255, 79, 109, 0.75); }
  }

  .secret-message{
    margin-top:24px;
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
    font-size:1.05rem;
    color:#fff0f5;
    line-height:1.6;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    backdrop-filter:blur(6px);
    padding:20px 24px;
    border-radius:18px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transform:translateY(-10px);
    transition: max-height 0.7s ease, opacity 0.6s ease, transform 0.6s ease, padding 0.6s ease, margin 0.6s ease;
  }
  .secret-message.show{
    max-height:300px;
    opacity:1;
    transform:translateY(0);
    margin-top:24px;
  }

  /* ============================================================
     ẢNH POLAROID XUNG QUANH
     ============================================================ */
  .photo-field{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none; /* chỉ ảnh mới bắt sự kiện, không chặn nội dung giữa */
  }

  .polaroid{
    position:absolute;
    pointer-events:auto;
    background:#fffdf9;
    padding:10px 10px 34px 10px;
    border-radius:6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    animation: driftFloat 7s ease-in-out infinite;
    transition: transform 0.4s ease, box-shadow 0.4s ease, z-index 0s;
    cursor:pointer;
  }
  .polaroid img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:2px;
  }
  .polaroid:hover{
    transform: scale(1.18) rotate(0deg) !important;
    box-shadow: 0 0 35px 8px var(--glow), 0 15px 30px rgba(0,0,0,0.4);
    z-index:40;
  }

  @keyframes driftFloat{
    0%,100% { margin-top:0px; }
    50%     { margin-top:-14px; }
  }

  /* Vị trí & kích thước cho từng khung ảnh (desktop) */
  .p1{ top:3%;   left:3%;   width:200px; height:250px; transform:rotate(-9deg);  animation-duration:6.5s; }
  .p2{ top:5%;   right:4%;  width:190px; height:235px; transform:rotate(8deg);   animation-duration:7.2s; }
  .p3{ top:24%;  left:0.5%; width:170px; height:215px; transform:rotate(6deg);   animation-duration:6s;   }
  .p4{ top:22%;  right:1%;  width:210px; height:260px; transform:rotate(-7deg);  animation-duration:7.8s; }
  .p5{ bottom:22%;left:1.5%;width:190px; height:240px; transform:rotate(10deg);  animation-duration:6.8s; }
  .p6{ bottom:20%;right:2%; width:200px; height:250px; transform:rotate(-11deg); animation-duration:7.4s; }
  .p7{ bottom:3%; left:9%;  width:170px; height:210px; transform:rotate(-5deg);  animation-duration:6.2s; }
  .p8{ bottom:4%; right:10%;width:175px; height:215px; transform:rotate(7deg);   animation-duration:7s;   }
  .p9{ top:44%;   left:5%;  width:150px; height:190px; transform:rotate(-4deg);  animation-duration:6.6s; display:none; }
  .p10{ top:46%;  right:6%; width:150px; height:190px; transform:rotate(5deg);   animation-duration:7.6s; display:none; }

  @media (min-width:1100px){
    .p9, .p10{ display:block; }
  }

  /* ============================================================
     NÚT NHẠC
     ============================================================ */
  .music-toggle{
    position:fixed;
    bottom:120px;
    right:20px;
    z-index:60;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.4);
    color:#fff;
    backdrop-filter:blur(8px);
    padding:10px 18px;
    border-radius:30px;
    font-family:inherit;
    font-size:0.9rem;
    cursor:pointer;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .music-toggle:hover{
    background:rgba(255,255,255,0.28);
    transform:translateY(-2px);
  }

  /* ============================================================
     FOOTER
     ============================================================ */
  .footer-line{
    position:absolute;
    bottom:12px;
    left:0; right:0;
    text-align:center;
    z-index:6;
    font-size:0.85rem;
    color:rgba(255,255,255,0.7);
    letter-spacing:0.3px;
  }

  /* ============================================================
     RESPONSIVE - ĐIỆN THOẠI / TABLET
     ============================================================ */
  @media (max-width:820px){
    .polaroid{ opacity:0.85; }
    .p1{ width:130px; height:162px; top:3%; left:3%; }
    .p2{ width:126px; height:157px; top:4%; right:4%; }
    .p3{ width:112px; height:140px; top:18%; left:1%; }
    .p4{ width:134px; height:167px; top:16%; right:1%; }
    .p5{ width:122px; height:152px; bottom:22%; left:2%; }
    .p6{ width:128px; height:160px; bottom:20%; right:3%; }
    .p7{ width:110px; height:137px; bottom:6%; left:9%; }
    .p8{ width:114px; height:142px; bottom:6%; right:10%; }
    .center-content{ padding:12px; }
    .secret-message{ font-size:0.95rem; padding:16px 18px; }
  }

  @media (max-width:480px){
    .polaroid{ display:none; } /* trên màn hình rất nhỏ, ẩn ảnh để không che chữ */
    .main-title{ font-size:clamp(2rem, 9vw, 2.6rem); }
    .love-btn{ padding:12px 26px; font-size:0.95rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

  <!-- Lớp ánh sáng bokeh nền -->
  <div class="bokeh-layer" id="bokehLayer"></div>

  <!-- Lớp trái tim bay nền -->
  <div class="hearts-layer" id="heartsLayer"></div>

  <div class="stage">

    <!-- ========================================================
         KHU VỰC ẢNH — THAY ẢNH CỦA BẠN Ở ĐÂY (mục 1: ẢNH)
         Chỉ cần đổi thuộc tính src="..." của mỗi <img>
         ======================================================== -->
    <div class="photo-field">
      <div class="polaroid p1"><img src="/img/1.jpg" alt="Kỷ niệm 1"></div>
      <div class="polaroid p2"><img src="/img/2.jpg" alt="Kỷ niệm 2"></div>
      <div class="polaroid p3"><img src="/img/3.jpg" alt="Kỷ niệm 3"></div>
      <div class="polaroid p4"><img src="/img/4.jpg" alt="Kỷ niệm 4"></div>
      <div class="polaroid p5"><img src="/img/5.jpg" alt="Kỷ niệm 5"></div>
      <div class="polaroid p6"><img src="/img/6.jpg" alt="Kỷ niệm 6"></div>
      <div class="polaroid p7"><img src="/img/7.jpg" alt="Kỷ niệm 7"></div>
      <div class="polaroid p8"><img src="/img/8.jpg" alt="Kỷ niệm 8"></div>
      <div class="polaroid p9"><img src="/img/9.jpg" alt="Kỷ niệm 9"></div>
      <div class="polaroid p10"><img src="/img/10.jpg" alt="Kỷ niệm 10"></div>
    </div>	

    <!-- ========================================================
         NỘI DUNG CHÍNH GIỮA — mục 3 & 4: TÊN NGƯỜI YÊU / LỜI NHẮN
         ======================================================== -->
    <div class="center-content">
      <h1 class="main-title">Anh yêu Hoài nhiều lắm ❤️</h1>
      <!-- Thay "em" ở trên bằng tên người yêu nếu muốn, ví dụ: "Anh yêu Minh Anh nhiều lắm ❤️" -->

      <p class="subtitle">Cảm ơn em vì đã xuất hiện trong cuộc đời anh.</p>

      <button class="love-btn" id="loveBtn">Bấm vào đây ❤️</button>

      <!-- Lời nhắn bí mật — sửa nội dung ở đây nếu muốn đổi câu chữ -->
      <div class="secret-message" id="secretMessage">
        Dù thế nào đi nữa, anh vẫn sẽ luôn yêu em và trân trọng em. ❤️
      </div>
    </div>

  </div>

  <!-- Nút bật/tắt nhạc -->
  <button class="music-toggle" id="musicToggle">🎵 Bật nhạc</button>

  <!-- ============================================================
       ÂM NHẠC — mục 2: THAY LINK NHẠC Ở BIẾN JS bên dưới (musicURL)
       ============================================================ -->
  <audio id="bgMusic" loop preload="none"></audio>

  <p class="footer-line">Made with love ❤️ — dành riêng cho em.</p>

  <script>
    /* ============================================================
       1) THAY LINK NHẠC NỀN Ở ĐÂY
       Dán URL file mp3 của bạn vào biến bên dưới.
       ============================================================ */
    const musicURL = "/img/nen.mp3"; // ví dụ: "https://example.com/nhac-nen.mp3"

    const audioEl = document.getElementById('bgMusic');
    if (musicURL) audioEl.src = musicURL;

    const musicBtn = document.getElementById('musicToggle');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      if (!musicURL) {
        musicBtn.textContent = "🎵 Chưa có nhạc";
        setTimeout(() => { musicBtn.textContent = isPlaying ? "⏸ Tắt nhạc" : "🎵 Bật nhạc"; }, 1400);
        return;
      }
      if (!isPlaying) {
        audioEl.play().then(() => {
          isPlaying = true;
          musicBtn.textContent = "⏸ Tắt nhạc";
        }).catch(() => {
          // Trình duyệt chặn autoplay / lỗi phát nhạc
          musicBtn.textContent = "🎵 Không thể phát";
          setTimeout(() => { musicBtn.textContent = "🎵 Bật nhạc"; }, 1500);
        });
      } else {
        audioEl.pause();
        isPlaying = false;
        musicBtn.textContent = "🎵 Bật nhạc";
      }
    });

    /* ============================================================
       NÚT "Bấm vào đây" -> hiện lời nhắn + trái tim bay lên
       ============================================================ */
    const loveBtn = document.getElementById('loveBtn');
    const secretMessage = document.getElementById('secretMessage');

    loveBtn.addEventListener('click', () => {
      secretMessage.classList.toggle('show');
      burstHearts(window.innerWidth / 2, window.innerHeight / 2, 14);
    });

    /* ============================================================
       TRÁI TIM NỀN BAY TỪ DƯỚI LÊN (ngẫu nhiên, liên tục)
       ============================================================ */
    const heartsLayer = document.getElementById('heartsLayer');
    const heartChars = ['❤','💗','💕','💖'];

    function spawnBackgroundHeart(){
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];

      const size = 14 + Math.random()*22;
      const left = Math.random()*100;
      const duration = 7 + Math.random()*8;
      const drift = (Math.random()*80 - 40) + 'px';

      heart.style.left = left + 'vw';
      heart.style.fontSize = size + 'px';
      heart.style.setProperty('--drift', drift);
      heart.style.animationDuration = duration + 's';
      heart.style.opacity = (0.5 + Math.random()*0.5).toFixed(2);

      heartsLayer.appendChild(heart);
      setTimeout(() => heart.remove(), duration*1000 + 200);
    }

    // Sinh trái tim nền liên tục ở tần suất vừa phải để tránh giật lag
    setInterval(spawnBackgroundHeart, 650);
    for (let i=0; i<6; i++){ setTimeout(spawnBackgroundHeart, i*200); }

    /* ============================================================
       CỤM TRÁI TIM KHI CLICK VÀO MÀN HÌNH
       ============================================================ */
    function burstHearts(x, y, count = 8){
      for (let i=0; i<count; i++){
        const h = document.createElement('span');
        h.className = 'click-heart';
        h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
        const angle = Math.random()*Math.PI*2;
        const dist = 20 + Math.random()*40;
        h.style.left = (x + Math.cos(angle)*dist) + 'px';
        h.style.top  = (y + Math.sin(angle)*dist) + 'px';
        h.style.fontSize = (14 + Math.random()*14) + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 950);
      }
    }

    document.addEventListener('click', (e) => {
      // tránh tạo hiệu ứng chồng khi bấm đúng nút yêu (đã có burst riêng)
      if (e.target.closest('#loveBtn') || e.target.closest('#musicToggle')) return;
      burstHearts(e.clientX, e.clientY, 8);
    });

    /* ============================================================
       LỚP ÁNH SÁNG BOKEH + HẠT LẤP LÁNH (sinh ngẫu nhiên 1 lần khi tải trang)
       ============================================================ */
    const bokehLayer = document.getElementById('bokehLayer');

    function createBokeh(count){
      for (let i=0; i<count; i++){
        const b = document.createElement('div');
        b.className = 'bokeh';
        const size = 60 + Math.random()*160;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random()*100 + 'vw';
        b.style.top = Math.random()*100 + 'vh';
        b.style.animationDuration = (6 + Math.random()*8) + 's';
        b.style.animationDelay = (Math.random()*5) + 's';
        bokehLayer.appendChild(b);
      }
    }

    function createSparkles(count){
      for (let i=0; i<count; i++){
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random()*100 + 'vw';
        s.style.top = Math.random()*100 + 'vh';
        s.style.animationDelay = (Math.random()*3) + 's';
        s.style.animationDuration = (2 + Math.random()*3) + 's';
        bokehLayer.appendChild(s);
      }
    }

    createBokeh(10);
    createSparkles(24);
  </script>

</body>
</html>
